services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stock_ledger
      POSTGRES_USER: stock
      POSTGRES_PASSWORD: stock
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock -d stock_ledger"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - stock_ledger_data:/var/lib/postgresql/data

volumes:
  stock_ledger_data:
